name: dev-deploy

# Manual-only (2026-11-05): the Actions budget is spent, so every automatic
# run ended in startup_failure and emailed the owner. Tests run locally
# before a merge; run this by hand from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  deploy-dev-vm:
    runs-on: ubuntu-latest
    needs: test
    # NOTE: `secrets` is NOT available in a job-level `if:` (only github/needs/
    # vars/inputs are), so gating the job on `secrets.* != ''` made GitHub
    # reject the whole file (0-job 'workflow file issue' runs). Gate inside the
    # step instead, where the `secrets` context IS available.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to dev VM
        env:
          KSG_DEV_VM_HOST: ${{ secrets.KSG_DEV_VM_HOST }}
          KSG_DEV_VM_USER: ${{ secrets.KSG_DEV_VM_USER }}
          KSG_DEV_VM_PORT: ${{ secrets.KSG_DEV_VM_PORT }}
          KSG_DEV_VM_APP_DIR: ${{ secrets.KSG_DEV_VM_APP_DIR }}
          KSG_DEV_VM_KEY: ${{ secrets.KSG_DEV_VM_KEY }}
          BUS_API_TOKEN: ${{ secrets.BUS_API_TOKEN }}
          DEV_BUS_PORT: 8091
          DEV_BUS_LOG_LEVEL: DEBUG
        run: |
          set -euo pipefail
          if [ -z "${KSG_DEV_VM_HOST}" ] || [ -z "${KSG_DEV_VM_USER}" ] || [ -z "${KSG_DEV_VM_KEY}" ]; then
            echo "Dev VM deploy secrets not set (KSG_DEV_VM_HOST/USER/KEY); skipping deploy."
            exit 0
          fi
          chmod +x scripts/deploy-dev-vm.sh
          ./scripts/deploy-dev-vm.sh
