name: ci

# Runs the test suite on every pull request and on pushes to feature
# branches, so a PR is red before it reaches dev. Pushes to `dev` and
# `master` are covered by dev-deploy.yml / prod-deploy.yml.
# Manual-only (2026-11-05): the Actions budget is spent, so every automatic
# run ended in startup_failure and emailed the owner. Tests run locally
# before a merge; run this by hand from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-mcp.txt -r requirements-a2a-test.txt

      - name: Run tests
        run: python -m pytest -q
