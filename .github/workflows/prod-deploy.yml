name: prod-deploy

# Manual-only (2026-11-05): the Actions budget is spent, so every automatic
# run ended in startup_failure and emailed the owner. Tests run locally
# before a merge; run this by hand from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  deploy-prod-vm:
    runs-on: ubuntu-latest
    needs: test
    # NOTE: `secrets` is NOT available in a job-level `if:`, so gate inside the
    # step instead, where the `secrets` context IS available.
    steps:
      - uses: actions/checkout@v4
      - name: Deploy prod
        env:
          IAC_BUS_PROD_HOST: ${{ secrets.IAC_BUS_PROD_HOST }}
          IAC_BUS_PROD_USER: ${{ secrets.IAC_BUS_PROD_USER }}
          IAC_BUS_PROD_KEY: ${{ secrets.IAC_BUS_PROD_KEY }}
          IAC_BUS_PROD_PORT: ${{ secrets.IAC_BUS_PROD_PORT }}
          IAC_BUS_PROD_APP_DIR: ${{ secrets.IAC_BUS_PROD_APP_DIR }}
          BUS_API_TOKEN: ${{ secrets.BUS_API_TOKEN }}
          PROD_BUS_PORT: "8101"
          PROD_BUS_LOG_LEVEL: INFO
          IAC_BUS_PUBLIC_HOST: iac-bus.knowshowgo.com
        run: |
          set -euo pipefail
          if [ -z "${IAC_BUS_PROD_HOST}" ] || [ -z "${IAC_BUS_PROD_USER}" ] || [ -z "${IAC_BUS_PROD_KEY}" ]; then
            echo "Prod deploy secrets not set (IAC_BUS_PROD_HOST/USER/KEY); skipping deploy."
            exit 0
          fi
          chmod +x scripts/deploy-prod-vm.sh
          ./scripts/deploy-prod-vm.sh
